# Gera o APK do app (sem Play Store) e publica pra download.
# Como usar: aba "Actions" do GitHub → "Gerar APK de teste" → "Run workflow".
# Quando terminar, o APK fica:
#   - em "Artifacts" no fim da página da execução; e
#   - publicado em Releases (tag "android"), que é o link do botão "Baixar app" do site:
#     https://github.com/<usuario>/<repo>/releases/download/android/ficha-ignea.apk
# Com os segredos KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS e KEY_PASSWORD configurados,
# o APK sai assinado sempre com a mesma chave (dá pra instalar uma versão por cima da outra).
name: Gerar APK de teste

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Montar a pasta do app (www)
        run: |
          mkdir -p /tmp/www
          rsync -a --exclude .git --exclude .github --exclude assets --exclude recursos --exclude README.md --exclude LICENSE ./ /tmp/www/
          mkdir -p build && mv /tmp/www build/www

      - name: Preparar o Capacitor
        working-directory: build
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app
          cat > capacitor.config.json <<'EOF'
          { "appId": "com.fichaignea.app", "appName": "Ficha Ígnea", "webDir": "www", "backgroundColor": "#0a0705" }
          EOF
          npx cap add android
          npx cap sync android

      - name: Ícone e tela de abertura
        working-directory: build/android/app/src/main/res
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          # monta o ícone a partir da logo da espada (img/icon-192.png), no fundo preto
          import glob, os
          from PIL import Image, ImageDraw
          FUNDO = (10, 7, 5, 255)
          logo = Image.open("../../../../../www/img/icon-192.png").convert("RGBA")
          logo = logo.crop(logo.getbbox())

          def quadro(lado, frac, fundo):
              c = Image.new("RGBA", (lado, lado), fundo)
              h = int(lado * frac); w = int(logo.width * h / logo.height)
              c.alpha_composite(logo.resize((w, h), Image.LANCZOS), ((lado - w) // 2, (lado - h) // 2))
              return c

          def redondo(img):
              m = Image.new("L", img.size, 0)
              ImageDraw.Draw(m).ellipse((0, 0, img.width - 1, img.height - 1), fill=255)
              o = Image.new("RGBA", img.size, (0, 0, 0, 0)); o.paste(img, (0, 0), m); return o

          tamanhos = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for dens, t in tamanhos.items():
              pasta = f"mipmap-{dens}"
              os.makedirs(pasta, exist_ok=True)
              quadro(t, .70, FUNDO).save(f"{pasta}/ic_launcher.png")
              redondo(quadro(t, .62, FUNDO)).save(f"{pasta}/ic_launcher_round.png")
              # ícone adaptativo (Android 8+): logo no meio, fundo vem da cor abaixo
              quadro(int(t * 108 / 48), .42, (0, 0, 0, 0)).save(f"{pasta}/ic_launcher_foreground.png")

          os.makedirs("values", exist_ok=True)
          open("values/ic_launcher_background.xml", "w").write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0a0705</color>\n</resources>\n')

          # tela de abertura: troca todas as splash.png pelo logo no fundo preto
          for f in glob.glob("drawable*/splash.png"):
              w, h = Image.open(f).size
              c = Image.new("RGBA", (w, h), FUNDO)
              lh = int(min(w, h) * .32); lw = int(logo.width * lh / logo.height)
              c.alpha_composite(logo.resize((lw, lh), Image.LANCZOS), ((w - lw) // 2, (h - lh) // 2))
              c.convert("RGB").save(f)
          print("ícones prontos:", sorted(glob.glob("mipmap-*/*.png")))
          PY

      - name: Barras do celular na cor do app
        working-directory: build/android/app/src/main/res
        run: |
          mkdir -p values
          cat > values/ignea_cores.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ignea_fundo">#0a0705</color>
          </resources>
          EOF
          python3 - <<'PY'
          import re
          p = "values/styles.xml"
          s = open(p, encoding="utf-8").read()
          itens = [
              '<item name="android:statusBarColor">@color/ignea_fundo</item>',
              '<item name="android:navigationBarColor">@color/ignea_fundo</item>',
              '<item name="android:windowBackground">@color/ignea_fundo</item>',
              '<item name="android:windowLightStatusBar">false</item>',
          ]
          # coloca as cores em cada tema do app, sem repetir o que o tema já define
          # (o tema da tela de abertura já tem o próprio fundo)
          def colocar(m):
              bloco = m.group(0)
              novos = "".join(i for i in itens if i.split('"')[1] not in bloco)
              return bloco.replace(">", ">" + novos, 1)
          s = re.sub(r'<style name="AppTheme[^"]*"[^>]*>.*?</style>', colocar, s, flags=re.S)
          open(p, "w", encoding="utf-8").write(s)
          print(s)
          PY

      - name: Número da versão
        working-directory: build/android/app
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Compilar o APK
        working-directory: build/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../saida
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ignea.jks"
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/ignea.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk ../saida/ficha-ignea.apk
          else
            echo "Sem chave configurada: gerando APK de teste (debug)"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../saida/ficha-ignea.apk
          fi

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: ficha-ignea-apk
          path: build/saida/ficha-ignea.apk

      - name: Publicar pra download (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTAS="Versão 1.0.${{ github.run_number }} do app Ficha Ígnea pra Android."
          if gh release view android > /dev/null 2>&1; then
            gh release upload android build/saida/ficha-ignea.apk --clobber
            gh release edit android --title "Ficha Ígnea para Android (1.0.${{ github.run_number }})" --notes "$NOTAS"
          else
            gh release create android build/saida/ficha-ignea.apk --title "Ficha Ígnea para Android (1.0.${{ github.run_number }})" --notes "$NOTAS" --latest
          fi
